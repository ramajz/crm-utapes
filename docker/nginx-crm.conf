# crm.rmjz.my.id → CRM-Utapes Laravel
# Container php-fpm crm-utapes-app:9000 di network minibio_minibio.
# PHP-FPM bicara FastCGI — pakai fastcgi_pass, BUKAN proxy_pass.
server {
    listen 80;
    listen [::]:80;
    server_name crm.rmjz.my.id;

    root /var/www/html;            # tidak dipakai, script ada di container CRM
    index index.php;
    client_max_body_size 64m;      # upload CSV backfill

    # Aset build CRM (Vite) — di-mount dari host, beda hash dengan aset MiniBio
    location /build/ {
        alias /crm-public/build/;
        try_files $uri =404;
    }

    location /favicon.ico {
        alias /crm-public/favicon.ico;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass crm-utapes-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_HOST $host;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
        fastcgi_buffering off;
    }
}
